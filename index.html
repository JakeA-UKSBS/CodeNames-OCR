<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Codenames Board</title>
<style>
  html, body { height: 100%; margin: 0; }
  body {
    background: #142019; color: #ecebe2;
    font-family: "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
    display: flex; flex-direction: column; gap: 12px;
    padding: 12px 16px; box-sizing: border-box;
  }
  header { display: flex; flex-wrap: wrap; gap: 12px; }
  .btn {
    font: 700 1.1rem/1 inherit; font-family: inherit; text-transform: uppercase; letter-spacing: .05em;
    padding: 14px 20px; border-radius: 8px; cursor: pointer; border: 2px solid #ecebe2;
    background: #ecebe2; color: #142019;
  }
  .btn.ghost { background: transparent; color: #ecebe2; }
  .btn.busy { opacity: .6; pointer-events: none; }
  .btn input { display: none; }
  #board {
    flex: 1; min-height: 0; display: grid;
    grid-template-columns: repeat(5, minmax(0, 1fr));
    grid-template-rows: repeat(5, minmax(0, 1fr));
    gap: 10px;
  }
  .card {
    background: #e9dfc8; color: #2a241a; border-radius: 8px;
    display: grid; place-items: center; padding: 6px; text-align: center;
    font-weight: 700; text-transform: uppercase; letter-spacing: .03em;
    font-size: clamp(1rem, 3vw, 2.4rem); line-height: 1.05; overflow-wrap: anywhere;
    outline: none;
  }
  .card:focus { box-shadow: 0 0 0 3px #8fa596; }
  .card.red { background: #c4473a; color: #fff; }
  .card.blue { background: #2e6db0; color: #fff; }
  .card.black { background: #0b0b0b; color: #fff; box-shadow: inset 0 0 0 2px #555; }
  .swatch { width: 52px; padding: 0; border: 3px solid transparent; border-radius: 8px; cursor: pointer; }
  .swatch.red { background: #c4473a; }
  .swatch.blue { background: #2e6db0; }
  .swatch.black { background: #0b0b0b; border-color: #555; }
  .swatch.on { border-color: #ecebe2; box-shadow: 0 0 0 3px #ecebe2; }
  #notesBtn { margin-left: auto; }
  #notes {
    position: fixed; top: 0; right: 0; bottom: 0; width: min(360px, 90vw);
    background: #0d1611; border-left: 2px solid #2a3a30; padding: 16px;
    box-sizing: border-box; display: flex; flex-direction: column; gap: 10px;
    transform: translateX(100%); transition: transform .2s; z-index: 5;
  }
  #notes.open { transform: none; }
  #notes .top { display: flex; align-items: center; gap: 10px; }
  #notes h2 { margin: 0; font-size: 1.3rem; text-transform: uppercase; letter-spacing: .05em; flex: 1; }
  #notes .btn { padding: 10px 14px; font-size: .95rem; }
  #clues {
    flex: 1; resize: none; border-radius: 8px; border: 2px solid #2a3a30; padding: 12px;
    background: #142019; color: #ecebe2; font-family: inherit; font-size: 1.3rem; line-height: 1.4;
  }
</style>
</head>
<body>
<header>
  <label class="btn" id="uploadBtn"><span>Upload photo</span>
    <input type="file" id="photo" accept="image/*">
  </label>
  <button class="btn ghost" id="clearBtn">Clear</button>
  <button class="swatch red" data-colour="red" aria-label="Red"></button>
  <button class="swatch blue" data-colour="blue" aria-label="Blue"></button>
  <button class="swatch black" data-colour="black" aria-label="Black"></button>
  <button class="btn ghost" id="notesBtn">Notes</button>
</header>
<main id="board"></main>
<aside id="notes" aria-label="Notes">
  <div class="top">
    <h2>Clues</h2>
    <button class="btn ghost" id="clearClues">Clear</button>
    <button class="btn" id="closeNotes">Close</button>
  </div>
  <textarea id="clues" placeholder="What do you want to say?"></textarea>
</aside>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js"></script>
<script>
const board = document.getElementById("board");
const uploadBtn = document.getElementById("uploadBtn");
const label = uploadBtn.querySelector("span");

function show(words) {
  board.innerHTML = "";
  for (let i = 0; i < 25; i++) {
    const c = document.createElement("div");
    c.className = "card";
    c.textContent = words[i] || "";
    if ((words[i] || "").length > 7) c.style.fontSize = "clamp(.8rem, 2.1vw, 1.7rem)";  // fit long words on one line
    c.contentEditable = "true";   // tap a card to fix or fill in a word
    c.spellcheck = false;
    // With a colour selected, tapping paints the card (tap again to remove)
    c.addEventListener("pointerdown", ev => {
      if (!colour) return;
      ev.preventDefault();
      const had = c.classList.contains(colour);
      c.classList.remove("red", "blue", "black");
      if (!had) c.classList.add(colour);
    });
    board.appendChild(c);
  }
}

function loadImage(file) {
  return new Promise((res, rej) => {
    const img = new Image();
    img.onload = () => res(img);
    img.onerror = rej;
    img.src = URL.createObjectURL(file);
  });
}

// Scale, rotate, and convert to high-contrast black and white
function prepare(img, deg, max = 2400) {
  const s = Math.min(1, max / Math.max(img.width, img.height));
  const w = img.width * s, h = img.height * s;
  const side = deg % 180 !== 0;
  const cv = document.createElement("canvas");
  cv.width = side ? h : w; cv.height = side ? w : h;
  const ctx = cv.getContext("2d");
  ctx.translate(cv.width / 2, cv.height / 2);
  ctx.rotate(deg * Math.PI / 180);
  ctx.drawImage(img, -w / 2, -h / 2, w, h);
  const d = ctx.getImageData(0, 0, cv.width, cv.height), p = d.data;
  let lo = 255, hi = 0;
  const g = new Uint8Array(p.length / 4);
  for (let i = 0; i < g.length; i++) {
    g[i] = 0.299 * p[i*4] + 0.587 * p[i*4+1] + 0.114 * p[i*4+2];
    if (g[i] < lo) lo = g[i]; if (g[i] > hi) hi = g[i];
  }
  const range = Math.max(1, hi - lo);
  for (let i = 0; i < g.length; i++) {
    const v = (g[i] - lo) * 255 / range > 110 ? 255 : 0;
    p[i*4] = p[i*4+1] = p[i*4+2] = v;
  }
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.putImageData(d, 0, 0);
  return cv;
}

// Keep clean all-caps words; each card prints its word twice, so keep the bigger one
function cleanWords(words) {
  const best = {};
  for (const w of words) {
    const raw = w.text.replace(/[^A-Za-z]/g, "");
    if (raw.length < 3 || raw !== raw.toUpperCase() || w.confidence < 65) continue;
    const h = w.bbox.y1 - w.bbox.y0;
    const item = { text: raw, h, x: (w.bbox.x0 + w.bbox.x1) / 2, y: (w.bbox.y0 + w.bbox.y1) / 2 };
    if (!best[raw] || h > best[raw].h) best[raw] = item;
  }
  return Object.values(best);
}

// Place words into a 5x5 grid: rows split at the 4 biggest vertical gaps,
// columns matched to the average positions from complete rows
function toGrid(items) {
  const grid = Array(25).fill("");
  if (!items.length) return grid;
  const byY = [...items].sort((a, b) => a.y - b.y);
  const cuts = byY.slice(1).map((it, i) => ({ i, gap: it.y - byY[i].y }))
    .sort((a, b) => b.gap - a.gap).slice(0, 4).map(g => g.i).sort((a, b) => a - b);
  const rows = []; let start = 0;
  for (const c of cuts) { rows.push(byY.slice(start, c + 1)); start = c + 1; }
  rows.push(byY.slice(start));
  rows.forEach(r => r.sort((a, b) => a.x - b.x));

  const full = rows.filter(r => r.length === 5);
  const cols = full.length ? [0,1,2,3,4].map(i => full.reduce((s, r) => s + r[i].x, 0) / full.length) : null;

  rows.slice(0, 5).forEach((r, ri) => {
    const used = new Set();
    r.forEach((it, k) => {
      let ci = k;
      if (cols && r.length < 5) {
        ci = cols.map((cx, i) => ({ i, d: Math.abs(cx - it.x) }))
          .filter(o => !used.has(o.i)).sort((a, b) => a.d - b.d)[0].i;
      }
      used.add(ci);
      if (ci < 5) grid[ri * 5 + ci] = it.text;
    });
  });
  return grid;
}

let worker;
async function getWorker() {
  if (!worker) {
    worker = await Tesseract.createWorker("eng");
    await worker.setParameters({ tessedit_pageseg_mode: "12" });
  }
  return worker;
}

document.getElementById("photo").addEventListener("change", async e => {
  const file = e.target.files[0];
  e.target.value = "";
  if (!file) return;
  uploadBtn.classList.add("busy");
  label.textContent = "Reading…";
  try {
    const img = await loadImage(file);
    const w = await getWorker();
    let best = [];
    // Cards are often photographed sideways, so try a few rotations and keep the best
    for (const deg of [0, 90, 270]) {
      const { data } = await w.recognize(prepare(img, deg));
      const items = cleanWords(data.words);
      if (items.length > best.length) best = items;
      if (best.length >= 20) break;
    }
    show(toGrid(best));
  } catch (err) {
    show([]);
  } finally {
    uploadBtn.classList.remove("busy");
    label.textContent = "Upload photo";
  }
});

document.getElementById("clearBtn").addEventListener("click", () => show([]));

// Notes popout
const notes = document.getElementById("notes");
document.getElementById("notesBtn").addEventListener("click", () => notes.classList.toggle("open"));
document.getElementById("closeNotes").addEventListener("click", () => notes.classList.remove("open"));
document.getElementById("clearClues").addEventListener("click", () => { document.getElementById("clues").value = ""; });

// Colour picker: tap a swatch to select it, tap it again to go back to editing words
let colour = null;
const swatches = document.querySelectorAll(".swatch");
swatches.forEach(s => s.addEventListener("click", () => {
  colour = colour === s.dataset.colour ? null : s.dataset.colour;
  swatches.forEach(x => x.classList.toggle("on", x.dataset.colour === colour));
  document.activeElement?.blur();
}));

show([]);
</script>
</body>
</html>
