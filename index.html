<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Codenames Board</title>
<style>
  html, body { height: 100%; margin: 0; }
  body {
    background: #142019; color: #ecebe2;
    font-family: "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
    display: flex; flex-direction: column; gap: 12px;
    padding: 12px 16px; box-sizing: border-box;
  }
  header { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  label.btn {
    background: #ecebe2; color: #142019; font-weight: 700; text-transform: uppercase;
    letter-spacing: .05em; padding: 14px 20px; border-radius: 8px; cursor: pointer; font-size: 1.1rem;
  }
  label.btn input { display: none; }
  #status { color: #8fa596; font-size: 1rem; }
  #board {
    flex: 1; min-height: 0; display: grid;
    grid-template-columns: repeat(5, minmax(0, 1fr));
    grid-template-rows: repeat(5, minmax(0, 1fr));
    gap: 10px;
  }
  .card {
    background: #e9dfc8; color: #2a241a; border-radius: 8px;
    display: grid; place-items: center; padding: 6px; text-align: center;
    font-weight: 700; text-transform: uppercase; letter-spacing: .03em;
    font-size: clamp(1rem, 3vw, 2.4rem); line-height: 1.05; overflow-wrap: anywhere;
    outline: none;
  }
  .card:focus { box-shadow: 0 0 0 3px #8fa596; }
</style>
</head>
<body>
<header>
  <label class="btn">Take photo
    <input type="file" id="photo" accept="image/*" capture="environment">
  </label>
  <span id="status">Photograph the 25 cards from straight above.</span>
</header>
<main id="board"></main>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js"></script>
<script>
const board = document.getElementById("board");
const status = document.getElementById("status");

function show(words) {
  board.innerHTML = "";
  for (let i = 0; i < 25; i++) {
    const c = document.createElement("div");
    c.className = "card";
    c.textContent = words[i] || "";
    c.contentEditable = "true";   // tap a word to fix a misread
    c.spellcheck = false;
    board.appendChild(c);
  }
}

// Shrink big phone photos so OCR is faster
function shrink(file, max = 2000) {
  return new Promise(res => {
    const img = new Image();
    img.onload = () => {
      const s = Math.min(1, max / Math.max(img.width, img.height));
      const cv = document.createElement("canvas");
      cv.width = img.width * s; cv.height = img.height * s;
      cv.getContext("2d").drawImage(img, 0, 0, cv.width, cv.height);
      res(cv);
    };
    img.src = URL.createObjectURL(file);
  });
}

// Group found words into rows by vertical position, then sort each row left to right
function toGrid(items) {
  if (items.length <= 5) return items.map(i => i.text);
  const byY = [...items].sort((a, b) => a.y - b.y);
  const gaps = byY.slice(1).map((it, i) => ({ i, gap: it.y - byY[i].y }))
    .sort((a, b) => b.gap - a.gap).slice(0, 4).map(g => g.i).sort((a, b) => a - b);
  const rows = []; let start = 0;
  for (const g of gaps) { rows.push(byY.slice(start, g + 1)); start = g + 1; }
  rows.push(byY.slice(start));
  return rows.flatMap(r => r.sort((a, b) => a.x - b.x).map(i => i.text));
}

document.getElementById("photo").addEventListener("change", async e => {
  const file = e.target.files[0];
  e.target.value = "";
  if (!file) return;
  status.textContent = "Reading cards… (first time takes a bit longer)";
  try {
    const canvas = await shrink(file);
    const { data } = await Tesseract.recognize(canvas, "eng");
    const items = data.words
      .map(w => ({ text: w.text.replace(/[^A-Za-z\-]/g, ""), conf: w.confidence,
                   x: (w.bbox.x0 + w.bbox.x1) / 2, y: (w.bbox.y0 + w.bbox.y1) / 2 }))
      .filter(w => w.text.length >= 2 && w.conf > 55);
    // Keep the 25 most confident words
    items.sort((a, b) => b.conf - a.conf);
    const top = items.slice(0, 25);
    show(toGrid(top));
    status.textContent = top.length === 25
      ? "Done. Tap any word to fix it."
      : `Found ${top.length} of 25. Tap a card to type a missing word, or retake the photo.`;
  } catch (err) {
    status.textContent = "Couldn't read that photo. Try again in better light.";
  }
});

show([]);
</script>
</body>
</html>
